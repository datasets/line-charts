<link rel="stylesheet" href="./assets/css/site.css">
<style>
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { font-size: 15px; color: var(--text-secondary); max-width: 74ch; }
  .entry { border-top: 1px solid var(--border); padding: 26px 0; max-width: 78ch; }
  .entry:first-of-type { border-top: none; }
  .entry time { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .entry h2 { font-size: 19px; letter-spacing: -0.01em; margin: 4px 0 10px; }
  .entry h2 a { color: var(--text-primary); }
  .entry h2 a:hover { color: var(--accent); }
  .entry h3 { font-size: 15px; margin: 18px 0 6px; }
  .entry p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 8px 0; }
  .entry ul { font-size: 14px; color: var(--text-secondary); line-height: 1.6; padding-left: 20px; margin: 8px 0; }
  .entry li { margin: 4px 0; }
  .entry code { font-family: var(--font-mono); font-size: 0.92em; background: color-mix(in srgb, var(--text-primary) 6%, transparent); padding: 1px 4px; border-radius: 4px; }
  .entry img { border: 1px solid var(--border); border-radius: 8px; margin: 12px 0; max-width: 100%; }
</style>
</head>

<div class="wrap" style="padding-top:30px">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">

    </div>
    <button class="toggle"></button>
  </div>

  <div id="entries" style="margin-top:30px"></div>

</div>

<script type="module" src="./assets/js/changelog.js"></script>
