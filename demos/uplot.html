<style>
  /* nudge uPlot's built-in chrome onto the shared theme */
  .u-legend { font-size: 11px; color: var(--text-secondary); }
  .u-axis { color: var(--text-muted); }
  .uplot { font-family: var(--font-sans); }
  /* the floating tooltip the grid and npm charts position in a setCursor hook */
  .u-tip { position: absolute; display: none; pointer-events: none; z-index: 10; white-space: nowrap;
    padding: 6px 8px; font: 11px/1.5 var(--font-sans); color: var(--text-primary);
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
  .u-tip i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./uplot.js"></script>
</body>
